<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <style>
        body { font-family: Arial, sans-serif; }
        .container { max-width: 400px; margin: auto; padding: 20px; }
        input { width: 100%; margin: 10px 0; padding: 10px; }
        button { padding: 10px; width: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Login</h2>
        <input type="text" id="username" placeholder="Username" required>
        <input type="password" id="password" placeholder="Password" required>
        <button onclick="login()">Login</button>
        <div id="message"></div>
    </div>

    <script>
        async function login() {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const response = await fetch('https://script.google.com/macros/s/AKfycbwVwiaDx3tSGXCOkCG_v2PY-6digpaJQBrA_rzcDaQFklLhhfdblZkD8-BhA0F9-VI/exec?action=validateUser&username=' + username + '&password=' + password);
            const result = await response.json();

            const message = document.getElementById('message');
            if (result.success) {
                message.innerText = 'Welcome, ' + result.name + '!';
            } else {
                message.innerText = 'Invalid username or password.';
            }
        }
    </script>
</body>
</html>
