<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/k.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kraai Technology Services</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;500;700&display=swap">
  <style>
    :root {
      --green: #1f7a1f;
      --green-dark: #145214;
      --offwhite: #f6f6f6;
      --blackish: #1a1a1a;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Roboto', sans-serif;
      background: var(--offwhite);
      color: var(--blackish);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      overflow-x: hidden;
    }

    header {
      background-color: var(--green);
      color: white;
      padding: 1rem 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      position: relative;
      z-index: 1000;
    }

    .logo {
      font-size: 1.5rem;
      font-weight: 700;
    }

    .logo a {
      color: white;
      text-decoration: none;
    }

    nav {
      display: flex;
      gap: 1.5rem;
      transition: all 0.3s ease;
    }

    nav a {
      color: white;
      text-decoration: none;
      font-weight: 500;
      transition: color 0.2s;
    }

    nav a:hover {
      color: #cdeac0;
    }

    /* Mobile menu button */
    .menu-toggle {
      display: none;
      flex-direction: column;
      justify-content: center;
      width: 30px;
      height: 25px;
      cursor: pointer;
      gap: 5px;
    }

    .menu-toggle span {
      display: block;
      height: 3px;
      background: white;
      border-radius: 3px;
      transition: all 0.3s ease;
    }

    /* Mobile nav hidden by default */
    @media (max-width: 768px) {
      nav {
        position: absolute;
        top: 100%;
        right: 0;
        background: var(--green);
        flex-direction: column;
        align-items: flex-start;
        width: 100%;
        max-height: 0;
        overflow: hidden;
      }

      nav.open {
        max-height: 300px;
        padding: 1rem 0;
      }

      nav a {
        display: block;
        padding: 0.75rem 1.5rem;
        width: 100%;
      }

      .menu-toggle {
        display: flex;
      }
    }

    .hero {
      padding: 4rem 2rem;
      text-align: center;
      background: linear-gradient(to bottom right, #ffffff, #e9f9ea);
      flex: 1;
    }

    .hero h1 {
      font-size: clamp(1.8rem, 5vw, 2.5rem);
      color: var(--green-dark);
      margin-bottom: 1rem;
    }

    .hero p {
      font-size: clamp(1rem, 4vw, 1.2rem);
      max-width: 600px;
      margin: 0 auto;
      color: #333;
    }

    footer {
      background: var(--green-dark);
      color: white;
      text-align: center;
      padding: 1rem 2rem;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <header>
    <div class="logo"><a href="/">KraaiTech</a></div>

    <div class="menu-toggle" id="menu-toggle">
      <span></span>
      <span></span>
      <span></span>
    </div>

    <nav id="navbar">
      <a href="/services/">Services</a>
      <a href="/store/">Store</a>
      <a href="https://customer.kraaitech.org/" target="_blank">Customer</a>
      <a href="https://employee.kraaitech.org/" target="_blank">Employee</a>
      <a href="/help/">Help/Contact</a>
      <a href="/servs/">Server Access</a>
    </nav>
  </header>

  <section class="hero">
    <h1>Welcome to Kraai Technology Services</h1>
    <p>Your trusted partner for reliable IT solutions, tech repairs, and smart support.</p>
  </section>

  <footer>
    Kraai Technology Services - 2025
  </footer>

  <script>
    const menuToggle = document.getElementById('menu-toggle');
    const navbar = document.getElementById('navbar');
    menuToggle.addEventListener('click', () => {
      navbar.classList.toggle('open');
      menuToggle.classList.toggle('active');
    });
  </script>
</body>
</html>
