<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/k.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Loaner Devices - Kraai Technology Services</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;500;700&display=swap">
  <style>
    :root {
      --green: #1f7a1f;
      --green-dark: #145214;
      --offwhite: #f6f6f6;
      --blackish: #1a1a1a;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Roboto', sans-serif;
      background: var(--offwhite);
      color: var(--blackish);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      overflow-x: hidden;
    }

    header {
      background-color: var(--green);
      color: white;
      padding: 1rem 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      position: relative;
    }

    .logo a {
      color: white;
      text-decoration: none;
      font-size: 1.5rem;
      font-weight: 700;
    }

    nav {
      display: flex;
      gap: 1.5rem;
      transition: all 0.3s ease;
    }

    nav a {
      color: white;
      text-decoration: none;
      font-weight: 500;
      transition: color 0.2s;
    }

    nav a:hover { color: #cdeac0; }

    .menu-toggle {
      display: none;
      flex-direction: column;
      width: 30px;
      height: 25px;
      cursor: pointer;
      gap: 5px;
    }

    .menu-toggle span {
      display: block;
      height: 3px;
      background: white;
      border-radius: 3px;
      transition: all 0.3s ease;
    }

    @media (max-width: 768px) {
      nav {
        position: absolute;
        top: 100%;
        right: 0;
        background: var(--green);
        flex-direction: column;
        align-items: flex-start;
        width: 100%;
        max-height: 0;
        overflow: hidden;
      }
      nav.open { max-height: 300px; padding: 1rem 0; }
      nav a { display: block; padding: 0.75rem 1.5rem; width: 100%; }
      .menu-toggle { display: flex; }
    }

    .content {
      flex: 1;
      padding: 2rem;
      max-width: 1000px;
      margin: auto;
    }

    h1 {
      text-align: center;
      color: var(--green-dark);
      margin-bottom: 1.5rem;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 1rem;
    }

    .device-card {
      background: white;
      border-radius: 10px;
      padding: 1rem;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      border-left: 6px solid var(--green);
      transition: transform 0.2s ease;
    }

    .device-card:hover {
      transform: translateY(-3px);
    }

    .device-id { font-weight: 700; margin-bottom: 0.3rem; }
    .desc { color: #333; margin-bottom: 0.4rem; font-size: 0.95rem; }
    .os { color: #666; margin-bottom: 0.4rem; font-size: 0.9rem; }
    .loc { color: #444; font-size: 0.9rem; }

    .status {
      font-weight: 600;
      padding: 0.4rem 0.8rem;
      border-radius: 6px;
      display: inline-block;
      margin-top: 0.5rem;
    }

    .status.IN {
      background: #d6f5d6;
      color: var(--green-dark);
    }

    .status.OUT {
      background: #f8d7da;
      color: #a30000;
    }

    footer {
      background: var(--green-dark);
      color: white;
      text-align: center;
      padding: 1rem;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <header>
    <div class="logo"><a href="/">KraaiTech</a></div>
    <div class="menu-toggle" id="menu-toggle"><span></span><span></span><span></span></div>
    <nav id="navbar">
      <a href="/">Home</a>
      <a href="/services/">Services</a>
      <a href="/store/">Store</a>
      <a href="/loaners.html">Loaner Devices</a>
      <a href="https://customer.kraaitech.org/" target="_blank">Customer</a>
    </nav>
  </header>

  <main class="content">
    <h1>Loaner Devices</h1>
    <div class="grid" id="deviceGrid">
      <!-- Devices loaded dynamically -->
    </div>
  </main>

  <footer>
    Kraai Technology Services - 2025
  </footer>

  <script>
    // Hamburger menu
    const menuToggle = document.getElementById('menu-toggle');
    const navbar = document.getElementById('navbar');
    menuToggle.addEventListener('click', () => navbar.classList.toggle('open'));

    const REPO = "iMacWeirdo/kraai-devices";
    const FILE_PATH = "devices.xml";
    const READ_TOKEN = "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"; // Replace with read-only PAT

    async function fetchDeviceData() {
      try {
        const res = await fetch(`https://api.github.com/repos/${REPO}/contents/${FILE_PATH}`, {
          headers: { Authorization: `token ${READ_TOKEN}` }
        });
        if (!res.ok) throw new Error("GitHub API error");
        const data = await res.json();
        const xmlText = atob(data.content);
        const parser = new DOMParser();
        return parser.parseFromString(xmlText, "text/xml");
      } catch (err) {
        console.error("Error fetching data:", err);
        return null;
      }
    }

    async function loadDevices() {
      const xmlDoc = await fetchDeviceData();
      const grid = document.getElementById("deviceGrid");
      grid.innerHTML = "";

      if (!xmlDoc) {
        grid.innerHTML = "<p style='text-align:center;'>Unable to load device list.</p>";
        return;
      }

      const devices = xmlDoc.getElementsByTagName("device");
      for (let d of devices) {
        const id = d.querySelector("id")?.textContent || "Unknown";
        const name = d.querySelector("name")?.textContent || "Unnamed Device";
        const desc = d.querySelector("description")?.textContent || "";
        const os = d.querySelector("os")?.textContent || "";
        const status = d.querySelector("status")?.textContent || "Unknown";
        const location = d.querySelector("location")?.textContent || "N/A";

        const card = document.createElement("div");
        card.className = "device-card";
        card.innerHTML = `
          <h3>${name}</h3>
          <div class="device-id">ID: ${id}</div>
          <div class="desc">${desc}</div>
          <div class="os">OS: ${os}</div>
          <div class="loc">Location: ${location}</div>
          <div class="status ${status}">${status === "IN" ? "Checked In" : status === "OUT" ? "Checked Out" : status}</div>
        `;
        grid.appendChild(card);
      }
    }

    loadDevices();

    // Optional: refresh every 60 seconds
    setInterval(loadDevices, 60000);
  </script>
</body>
</html>
